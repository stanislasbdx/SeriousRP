name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Gradle tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'corretto'
          cache: 'gradle'
      - name: Run tests
        run: ./gradlew test jacocoTestCoverageVerification --stacktrace
