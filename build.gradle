plugins {
    id 'java'
    id 'jacoco'
    id "org.sonarqube" version "6.3.1.5724"
}

group = 'fr.stan1712.wetston'
version = '5.0.4'

repositories {
    mavenCentral()
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    maven {
        url = 'https://jitpack.io'
    }
    mavenLocal()
}

sonar {
    properties {
        property "sonar.projectKey", "stanislasbdx_SeriousRP_28a0ef7b-fa03-4300-ab66-7308561e1bc2"
        property "sonar.projectName", "SeriousRP"
        property "sonar.scanner.socketTimeout", "120"
        property "sonar.exclusions", "**/Metrics.java"
        property "sonar.coverage.exclusions", "**/Metrics.java,**/Main.java,**/Config.java,**/Recipes.java,**/UpdateChecker.java,**/events/Death.java"
        property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
    }
}

project.tasks["sonar"].dependsOn("build")

dependencies {
    compileOnly "org.spigotmc:spigot-api:26.2-R0.1-SNAPSHOT"
    compileOnly "com.github.MilkBowl:VaultAPI:1.7.1"
    implementation "org.slf4j:slf4j-api:2.0.16"

    compileOnly "org.projectlombok:lombok:1.18.46"
    annotationProcessor "org.projectlombok:lombok:1.18.46"

    implementation "com.google.code.gson:gson:2.11.0"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testImplementation "org.mockito:mockito-junit-jupiter:5.14.2"
    testImplementation "org.spigotmc:spigot-api:26.2-R0.1-SNAPSHOT"
    testImplementation "com.github.MilkBowl:VaultAPI:1.7.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def coverageExcludes = [
    '**/Metrics.class',
    '**/Metrics$*.class',
    '**/Main.class',
    '**/Config.class',
    '**/Recipes.class',
    '**/UpdateChecker.class',
    '**/Death.class',
    '**/Death$*.class'
]

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.13"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: coverageExcludes)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.60
            }
        }
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: coverageExcludes)
        }))
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
